// Compose compiler stability configuration.
//
// Classes listed here are treated as **stable** even where the compiler cannot prove it, which lets composables
// taking them be *skippable* — recomposition is skipped when their arguments are unchanged. The convention plugin
// (`ComposeConfig.kt`) has pointed at this file since the Compose setup was written; it just never existed, which is
// why every build logged "Stability configuration file not found".
//
// **A wrong entry here is a silent bug, not a build error.** Declaring something stable that actually mutates in
// place means Compose skips a recomposition it needed, and the UI shows a stale value with nothing to point at. So
// every entry below is justified, and the rule the codebase has to keep is stated with it.

// ---------------------------------------------------------------------------------------------------------------
// `core:model` — the shapes every surface draws from.
//
// It is a plain `jvm.library` (see its build file: no Compose compiler), so the compiler never runs over it and its
// classes carry no inferred-stability metadata. Consumers therefore treat them as unstable, which reaches a long way:
// `AppInfo`, `ComponentKey`, `GridPlacement`, `GridConfig`, `IconSizing`, `Folder` and `Category` are parameters of
// most cells, grids and surfaces in the app.
//
// Safe because the module is *entirely* immutable: every declaration is a `data class` of `val`s, an `enum`, or a
// `sealed interface` over those — no `var`, no `MutableList`/`MutableMap`, no arrays. Verified rather than assumed.
//
// **The rule this depends on:** `core:model` stays immutable. Adding a `var` or a mutable collection there silently
// invalidates this line. The alternative would be annotating each class `@Immutable`, which is rejected because it
// would drag `compose-runtime` into a module that has no business depending on Compose.
inkspire.morphic.core.model.*

// ---------------------------------------------------------------------------------------------------------------
// Kotlin's read-only collection interfaces.
//
// `List`/`Map`/`Set` are interfaces whose implementations *may* be mutable, so the compiler cannot call them stable —
// yet they are the shape of nearly every piece of state here (`List<AppInfo>`, `List<List<AppsItem>>`,
// `Map<GridSlot, IconSizing>`, `Map<HomeEdge, SurfaceBinding>`).
//
// **The rule this depends on:** a collection reaching a composable is never mutated in place — it is replaced. That
// is how the state holders already work: every list is produced by `map`/`filter` and a new one is emitted. The
// mutable maps that do exist (`AppsCategoryPager`'s geometry map) are deliberately read outside composition, and the
// snapshot-backed ones (`mutableStateMapOf`, `NavBackStack`) are genuinely stable observables in their own right.
//
// If a collection ever does need in-place mutation as a composable input, it must be a snapshot type
// (`mutableStateListOf`/`mutableStateMapOf`) rather than a plain one — which is the correct fix regardless of this file.
kotlin.collections.*

// ---------------------------------------------------------------------------------------------------------------
// `IconMetrics` — per-surface icon + label sizing.
//
// The compiler already reports it as `stable class` *inside* `core:designsystem`, but that inference does not reach
// the consuming modules: `feature:apps` and `feature:home` see it as an unstable parameter. That is not cosmetic —
// under strong skipping an unstable argument is compared by **instance**, and `AppsScreen`/`HomeScreen` build a fresh
// `IconMetrics` each recomposition (resolving the store's `IconSizing` through `toIconMetrics()`), so every layout
// taking one would recompose on every frame of an unrelated state change.
//
// Safe for the same reason the compiler already says so: a `data class` of `Float`, `Boolean` and `Dp`, all `val`.
inkspire.morphic.core.designsystem.cell.IconMetrics
